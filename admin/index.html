<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Staff login</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--tx:#14211d;--mu:#5d6b66;--bd:#d5ddd8;--ac:#0d5c43;--on:#fff;--rd:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
main{max-width:380px;margin:12vh auto 0}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 20px;font-size:14px}
form{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:18px;display:grid;gap:14px}
label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
input{padding:11px;border:1px solid var(--bd);border-radius:6px;font-size:16px;background:var(--bg);color:var(--tx);width:100%}
button{padding:12px;border:0;border-radius:6px;background:var(--ac);color:var(--on);font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#err{margin:0;color:var(--rd);font-size:14px;min-height:20px}
a{color:var(--ac)}p.back{margin-top:16px;font-size:14px}
</style></head><body>
<main>
<h1>Staff login</h1>
<p class="sub" id="note">For Rolva Finance Technologies staff only.</p>
<form id="f">
<label>Email<input id="em" type="email" required autocomplete="username"></label>
<label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
<button id="go">Sign in</button>
<p id="err" role="alert"></p>
</form>
<p class="back"><a href="../">Back to the website</a></p>
</main>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
var C=window.RF_CONFIG||{},$=function(i){return document.getElementById(i)},sb=null;
if(window.supabase&&C.SUPABASE_URL&&C.SUPABASE_ANON_KEY)sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
if(/denied=1/.test(location.search))$('err').textContent='That account does not have staff access.';
function isStaff(u){return sb.from('admins').select('role').eq('user_id',u.id).maybeSingle().then(function(r){return !!r.data})}
if(sb){sb.auth.getSession().then(function(s){var u=s.data&&s.data.session&&s.data.session.user;if(u)return isStaff(u).then(function(ok){if(ok)location.replace('manager.html')})}).catch(function(){})}
$('f').addEventListener('submit',function(e){
e.preventDefault();
if(!sb){$('err').textContent='This site is not configured yet. Add your Supabase details to config.js.';return}
$('go').disabled=true;$('err').textContent='';
sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value}).then(function(r){
if(r.error||!r.data||!r.data.user){$('err').textContent='The email or password is incorrect.';$('go').disabled=false;return}
return isStaff(r.data.user).then(function(ok){
if(ok){location.replace('manager.html');return}
return sb.auth.signOut().then(function(){$('err').textContent='That account does not have staff access.';$('go').disabled=false})})
}).catch(function(){$('err').textContent='Could not sign in. Check your connection and try again.';$('go').disabled=false});
});
})();
</script></body></html>
